name: ORQELON First Red - mloda-registry #715

on:
  push:
    branches:
      - fix/715-polars-is-in-mask
  workflow_dispatch:

jobs:
  first-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-packages --extra dev
      - name: Install current mloda main for compatibility First Red
        run: uv pip install --reinstall "mloda @ git+https://github.com/mloda-ai/mloda.git@754e6f0305d25fbbe69b30fa9ce71b1a80c4442d"
      - name: Diagnose mloda install resolution
        run: |
          echo "=== uv pip show mloda ==="
          uv pip show mloda
          echo "=== installed distribution files ==="
          .venv/bin/python - <<'PY'
          import importlib.metadata as md
          d = md.distribution("mloda")
          print("version:", d.version)
          print("dist-info:", d._path)
          print("direct_url:", d.read_text("direct_url.json"))
          print("metadata version:", d.metadata.get("Version"))
          PY
          echo "=== pyproject declared mloda constraints ==="
          grep -R "mloda" -n pyproject.toml uv.lock | head -80
      - name: Show compatibility versions
        run: .venv/bin/python -c "import importlib.metadata; print('mloda', importlib.metadata.version('mloda')); print('polars', importlib.metadata.version('polars'))"
      - name: Inspect imported PolarsExprMaskEngine runtime source
        run: |
          .venv/bin/python - <<'PY'
          import inspect
          import mloda_plugins.compute_framework.base_implementations.polars.polars_expr_mask_engine as module
          print("runtime module file:", module.__file__)
          print("runtime mloda distribution:", __import__("importlib.metadata").metadata.version("mloda"))
          print("runtime is_in source:")
          print(inspect.getsource(module.PolarsExprMaskEngine.is_in))
          PY
      - name: Run focused regression test
        run: .venv/bin/pytest mloda/community/feature_groups/data_operations/tests/test_mask_utils.py::TestBuildPolarsMaskExpr::test_apply_polars_mask_is_in_uses_lazyframe -q -s
