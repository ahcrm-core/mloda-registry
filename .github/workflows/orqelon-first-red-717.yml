name: ORQELON Cross Framework 717

on:
  push:
    branches:
      - fix/717-duckdb-nan-mask-first-red
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: uv sync --all-packages --extra dev
      - name: Run issue 717 cross-framework parity
        run: uv run pytest mloda/community/feature_groups/data_operations/aggregation/tests/test_issue_717_cross_framework.py -q -s
