name: ORQELON Fresh Holdout 717

on:
  push:
    branches:
      - fix/717-duckdb-nan-mask-first-red
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: uv sync --all-packages --extra dev
      - name: Run issue 717 fresh holdout
        run: uv run pytest mloda/community/feature_groups/data_operations/tests/test_mask_utils.py::TestBuildSqlCaseWhen::test_issue_717_fresh_duckdb_nan_holdout -q
